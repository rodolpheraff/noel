<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF5EC">
<title>Joyeux Noël !</title>
<meta property="og:title" content="Joyeux Noël !">
<meta property="og:description" content="Un petit paquet de la part de Bérénice et Rodolphe">
<meta property="og:image" content="https://rodolpheraff.github.io/noel/partage.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #25302B; --ink2: #46524B; --accent: #C8473B; --sapin: #2F6B57;
    --paper: #FBF5EC; --paper2: #F1E6D3; --line: #E4D6BF;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 400 16px/1.45 Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  #neige { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  header, main, footer { position: relative; z-index: 1; width: 100%; max-width: 420px; }
  header { text-align: center; margin: 8px 0 18px; }
  h1 {
    font: 800 clamp(2.2rem, 10vw, 3rem)/1 "Bricolage Grotesque", sans-serif;
    letter-spacing: -.03em; color: var(--accent);
  }
  header .pour { margin-bottom: 6px; color: var(--ink2); font-size: 15px; }
  header h1 { font-size: clamp(1.8rem, 8vw, 2.4rem); }
  .cadre {
    position: relative; aspect-ratio: 9 / 16; width: auto;
    height: min(calc(100vh - 190px), calc((100vw - 32px) * 16 / 9), 746px);
    height: min(calc(100dvh - 190px), calc((100vw - 32px) * 16 / 9), 746px);
    margin: 0 auto;
    border-radius: 18px; overflow: hidden; background: var(--paper2);
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -18px rgba(37,48,43,.45);
  }
  video { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--paper2); }
  .lancer {
    position: absolute; inset: 0; border: 0; cursor: pointer;
    background: url(affiche.jpg) center / cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 14%; gap: 10px; font: inherit; color: var(--ink);
  }
  .rond {
    width: 84px; height: 84px; border-radius: 50%; background: var(--sapin);
    display: grid; place-items: center;
    box-shadow: 0 10px 24px -8px rgba(47,107,87,.7);
    animation: pouls 1.8s ease-in-out infinite;
  }
  .rond svg { width: 34px; height: 34px; margin-left: 5px; fill: #fff; }
  .lancer span { font-weight: 600; background: rgba(251,245,236,.92); padding: 4px 12px; border-radius: 99px; }
  .lancer:focus-visible .rond { outline: 3px solid var(--accent); outline-offset: 4px; }
  @keyframes pouls { 50% { transform: scale(1.07); } }
  @media (prefers-reduced-motion: reduce) { .rond { animation: none; } }
  footer { text-align: center; margin-top: 16px; font-size: 14px; color: var(--ink2); }
  footer .son { display: inline-block; margin-bottom: 4px; }
</style>
</head>
<body>
<canvas id="neige" aria-hidden="true"></canvas>

<header>
  <p class="pour">Pour Didier, Cath, Ophélie, Julien, Hugo et Léon</p>
  <h1>Un cadeau à ouvrir</h1>
</header>

<main>
  <div class="cadre">
    <video id="video" src="video.mp4" poster="affiche.jpg" playsinline preload="metadata"></video>
    <button class="lancer" id="lancer" aria-label="Lancer la vidéo">
      <div class="rond"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>
      <span>Ouvrir le paquet</span>
    </button>
  </div>
</main>

<footer>
  <div class="son">🔊 Montez le son</div>
  <div>Bérénice &amp; Rodolphe</div>
</footer>

<script>
  const video = document.getElementById('video');
  const lancer = document.getElementById('lancer');
  lancer.addEventListener('click', () => {
    lancer.remove();
    video.controls = true;
    video.play();
  });

  // Neige legere
  const c = document.getElementById('neige'), ctx = c.getContext('2d');
  const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flocons = [];
  function taille() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    flocons = Array.from({ length: Math.round(innerWidth / 9) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: (1 + Math.random() * 2.2) * devicePixelRatio,
      v: (.3 + Math.random() * .7) * devicePixelRatio, d: Math.random() * 6.28
    }));
  }
  function dessiner() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(200,71,59,.18)';
    for (const f of flocons) {
      f.y += f.v; f.d += .01; f.x += Math.sin(f.d) * .4;
      if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28); ctx.fill();
    }
    requestAnimationFrame(dessiner);
  }
  taille(); addEventListener('resize', taille);
  if (!calme) dessiner();
</script>
</body>
</html>
